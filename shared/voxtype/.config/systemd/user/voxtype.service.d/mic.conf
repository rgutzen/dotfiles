# Dictation records from the laptop's built-in microphone, never the headset.
#
# The system default source follows the Bluetooth headset. Opening the
# headset's microphone switches it from A2DP to the call profile; on this
# headset the switch fails and recreates every audio stream. Observed
# 2026-11-23: the first second of each dictation was lost ("No audio was
# captured", 30 of 239 recordings in 3 days), and voxtype's volume duck could
# not restore streams that no longer existed, so playback stayed quiet.
#
# voxtype names devices the ALSA way (`pipewire`, `default`), so config.toml
# says `device = "pipewire"` and the PipeWire ALSA plugin takes its target
# node from PIPEWIRE_NODE.
[Service]
Environment=PIPEWIRE_NODE=alsa_input.pci-0000_65_00.6.analog-stereo
