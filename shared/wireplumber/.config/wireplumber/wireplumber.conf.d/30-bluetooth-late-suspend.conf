## Keep a Bluetooth sink awake for a while after playback.
##
## The bluez node suspends five seconds after the last stream, and a headset
## then needs a codec and transport restart that swallows the first fraction of
## a second of the next sound — the first word of a spoken reply. Thirty seconds
## keeps a conversation warm without holding the radio open indefinitely.
##
## This does not replace waking the sink before synthesis: a cold start after
## half a minute is still cold, and `say` covers it with `preroll` in
## ~/.config/voice-tts/config.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output\\..*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 30
      }
    }
  }
]
