# Always-on for the vault sync: Syncthing must keep syncing when nobody is
# looking at it, and a stopped daemon is silent -- the vault simply stops
# moving between the laptop and the phone.
#
# The Arch package unit restarts on failure with RestartSec=1 and gives up after
# 4 failures in 60 s. A transient index or network error then reaches that
# ceiling and leaves the daemon stopped until someone notices. Raise the ceiling
# rather than removing it: a genuinely broken unit still stops instead of
# spinning forever.
#
# Config, folder and device live in ~/.local/state/syncthing/config.xml; this
# drop-in changes only how systemd supervises the process.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=20

[Service]
Restart=always
RestartSec=5
