[Service]
# A Chromium-family application holds ONE connection to PipeWire's PulseAudio
# server for the life of its `audio.mojom.AudioService` utility process. When
# that server restarts, the connection is dead and Chromium never reconnects:
# enumerateDevices() then returns no audioinput at all, getUserMedia({audio:true})
# has no device to offer, and the page reports "microphone blocked" — a
# permission-shaped symptom with no permission cause.
#
# Measured 2026-11-06: three pipewire restarts left Brave's audio service (alive
# since the browser started) seeing one device, videoinput only, while a fresh
# profile on the same machine saw all three kinds. Killing the audio service
# makes Chromium respawn it with a fresh connection; the browser keeps its tabs.
#
# ExecStartPost on the pulse server means this fires on the event that causes
# the breakage, not on a timer, and not when someone notices hours later.
# The leading `-` is deliberate: this hook is for making other programs recover,
# and must never be able to fail the audio server it hangs off.
ExecStartPost=-%h/06_SYSTEM/engine/host/recycle-browser-audio.sh
