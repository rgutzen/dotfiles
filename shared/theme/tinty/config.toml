# tinty configuration — Thrifted Rug (base24)
# Source of truth: ~/02_AREAS/B_Tech/dotfiles/shared/theme/tinty/config.toml
# Symlinked to:    ~/.config/tinted-theming/tinty/config.toml
#
# NOTE ON CUSTOM SCHEMES:
# Community template repos (base16-i3, base16-polybar, …) publish PRE-BUILT
# themes for official schemes only — they contain no file for "thrifted-rug".
# Items whose theme must be generated are therefore built locally with
# `tinty build`, driven by apply-theme.sh, rather than listed here.
# Only items that ship a usable pre-built theme, or that we build into a
# themes-dir ourselves, belong in [[items]].

shell = "bash -c '{}'"
default-scheme = "base24-thrifted-rug"

# Use our own schemes dir as the source, so custom schemes are first-class
# and survive `tinty update` (which re-pulls the official schemes repo).
[schemes]
path = "~/02_AREAS/B_Tech/dotfiles/shared/theme/schemes"

# --- terminal ------------------------------------------------------------
# tinted-shell ships 196 base24 themes and sets colours via OSC escape
# sequences, so it works with GNOME Terminal WITHOUT any dconf writes —
# replacing the old imperative set_terminal_theme.sh entirely.
# For a custom scheme the theme file is generated by apply-theme.sh into
# the local themes dir before this item is used.
[[items]]
name = "tinted-shell"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "scripts"
hook = "source \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16", "base24"]
